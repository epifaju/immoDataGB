# Profil local uniquement. Valeurs par défaut = .env.example (jetables).
# Surcharge possible via SPRING_DATASOURCE_* / variables d'environnement.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/immodata}
    username: ${SPRING_DATASOURCE_USERNAME:immodata}
    password: ${SPRING_DATASOURCE_PASSWORD:immodata}
    hikari:
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  confidence:
    recalculation-enabled: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
