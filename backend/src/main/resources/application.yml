spring:
  application:
    name: immodata-gb
  profiles:
    default: dev
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

app:
  confidence:
    recalculation-enabled: false
  documents:
    mutations-enabled: false
    bucket: documents
    signed-url-ttl: 15m
  imports:
    mutations-enabled: false
    organisation-id: ${APP_IMPORTS_ORGANISATION_ID:}
    max-file-size-bytes: 5242880
